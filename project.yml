# Xcode-Projekt wird mit XcodeGen erzeugt: `xcodegen` im Repo-Ordner ausführen.
name: Ohrregal
options:
  bundleIdPrefix: de.drdothouse
  deploymentTarget:
    iOS: "17.0"
packages:
  Kern:
    path: Kern
targets:
  Ohrregal:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: Kern
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Ohrregal
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio, fetch]
        BGTaskSchedulerPermittedIdentifiers: [de.drdothouse.Ohrregal.vorladen]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Ohrregal hört kurz zu, um den gerade laufenden Titel zu erkennen.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlayDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.drdothouse.Ohrregal
        CODE_SIGN_ENTITLEMENTS: App/Ohrregal.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.19.0"
        CURRENT_PROJECT_VERSION: "1"
