# Baut das Docker-Image des Server-Dienstes (Dienst/) und legt es in der GitHub Container Registry ab.
name: Dienst-Image

on:
  push:
    branches: [main]
    paths: ["Dienst/**", ".github/workflows/dienst-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Tests
        working-directory: Dienst
        run: python3 -m unittest test_bewertung.py

      - name: Version lesen
        id: version
        run: |
          echo "wert=$(grep -oP '^VERSION = "\K[^"]+' Dienst/hoerbuch_wunsch.py)" >> "$GITHUB_OUTPUT"
          echo "besitzer=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: Dienst
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.version.outputs.besitzer }}/ohrregal-wunsch:latest
            ghcr.io/${{ steps.version.outputs.besitzer }}/ohrregal-wunsch:${{ steps.version.outputs.wert }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Hörbuchwunsch – Server-Dienst für Ohrregal
