name: TV-App

# Baut die App für Fire TV und Android TV und legt sie als Release „tv“ ab.
# Feste Download-Adresse: https://github.com/DrdotHouse2106/Ohrregal/releases/download/tv/ohrregal-tv.apk
on:
  push:
    branches: [main]
    paths: ['TV/**', '.github/workflows/tv.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Signierschlüssel
        env:
          B64: ${{ secrets.TV_KEYSTORE_B64 }}
        run: |
          if [ -z "$B64" ]; then echo "::error::Secret TV_KEYSTORE_B64 fehlt (siehe TV/LIESMICH.md)"; exit 1; fi
          echo "$B64" | base64 -d > "$RUNNER_TEMP/ohrregal-tv.jks"
          echo "TV_KEYSTORE_DATEI=$RUNNER_TEMP/ohrregal-tv.jks" >> "$GITHUB_ENV"

      - name: APK bauen
        working-directory: TV
        env:
          VERSION_CODE: ${{ github.run_number }}
          TV_KEYSTORE_PASSWORT: ${{ secrets.TV_KEYSTORE_PASSWORT }}
        run: |
          gradle assembleDirektRelease assembleStoreRelease bundleStoreRelease --no-daemon
          # Direkt-APK (mit Updater) für Downloader/adb, Store-Fassungen ohne Updater für Amazon und Google Play.
          cp app/build/outputs/apk/direkt/release/app-direkt-release.apk ohrregal-tv.apk
          cp app/build/outputs/apk/store/release/app-store-release.apk ohrregal-tv-amazon.apk
          cp app/build/outputs/bundle/storeRelease/app-store-release.aab ohrregal-tv.aab
          # Die Direkt-APK prüft beim Start diese Datei und bietet neuere Versionen an.
          echo '{"versionCode": ${{ github.run_number }}, "versionName": "0.1.${{ github.run_number }}", "apk": "https://github.com/DrdotHouse2106/Ohrregal/releases/download/tv/ohrregal-tv.apk"}' > version.json

      - name: Als Release „tv“ veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv
          name: Ohrregal TV
          make_latest: false
          files: |
            TV/ohrregal-tv.apk
            TV/ohrregal-tv-amazon.apk
            TV/ohrregal-tv.aab
            TV/version.json
          body: |
            App für Fire TV und Android TV (z. B. waipu.tv-Stick), Version 0.1.${{ github.run_number }}.
            Installieren mit der App „Downloader“: https://github.com/DrdotHouse2106/Ohrregal/releases/download/tv/ohrregal-tv.apk
            ohrregal-tv.apk: direkt installieren (mit Update-Hinweis in der App).
            Für die Stores ohne Updater: ohrregal-tv.aab (Google Play), ohrregal-tv-amazon.apk (Amazon Appstore).

      - name: Amazon-Entwurf aktualisieren
        env:
          AMAZON_CLIENT_ID: ${{ secrets.AMAZON_CLIENT_ID }}
          AMAZON_CLIENT_SECRET: ${{ secrets.AMAZON_CLIENT_SECRET }}
          AMAZON_APP_ID: amzn1.devportal.mobileapp.741cc5dcfc454e67ac346b0a4d55022d
        # Store-Fassung ohne eigenen Updater (Amazon aktualisiert selbst).
        run: bash .github/scripts/amazon-entwurf.sh TV/ohrregal-tv-amazon.apk
